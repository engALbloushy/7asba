:root[lang="ar"]{ --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1310; --surface:#131d19; --sunk:#0f1814; --ink:#e6eee9; --muted:#9aaba2; --line:#24322b; --line-strong:#33453c;
  --felt:#164a37; --felt-hi:#1d5e46; --on-felt:#eef8f3; --red:#f07780; --red-soft:#3a1c20;
  --gold:#e8bd55; --gold-hi:#e8bd55; --gold-soft:#2c2412; --win:#62cfa1; --win-soft:#17302a; --link:#62cfa1;
  --shadow:0 1px 2px #0006; --hdr:#6c151b; --jj-bg:#1f5440; --jj-ink:#a6ecc9; --jj-line:#2f6b53; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1310; --surface:#131d19; --sunk:#0f1814; --ink:#e6eee9; --muted:#9aaba2; --line:#24322b; --line-strong:#33453c;
  --felt:#164a37; --felt-hi:#1d5e46; --on-felt:#eef8f3; --red:#f07780; --red-soft:#3a1c20;
  --gold:#e8bd55; --gold-hi:#e8bd55; --gold-soft:#2c2412; --win:#62cfa1; --win-soft:#17302a; --link:#62cfa1;
  --shadow:0 1px 2px #0006; --hdr:#6c151b; --jj-bg:#1f5440; --jj-ink:#a6ecc9; --jj-line:#2f6b53; color-scheme:dark}

*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.alt{color:var(--muted);font-size:.9em}
.hint{font-size:13.5px;color:var(--muted)}
.lab{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* press feedback */
.press{transition:transform .12s var(--ease),background-color .15s,border-color .15s,color .15s}
.press:active:not(:disabled){transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.press{transition:none}.press:active:not(:disabled){transform:none;opacity:.8}}

/* app bar */
header.band{background:var(--hdr);color:var(--hdr-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;position:relative;overflow:hidden}
header.band::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 140% at 100% 0%,#ffffff12 0,transparent 55%),repeating-linear-gradient(0deg,#00000014 0 1px,transparent 1px 3px)}
.sadu-band{height:var(--sadu-band-h);background:var(--sadu-band) repeat-x;background-position:center top}
.wrap{max-width:720px;margin:0 auto}
.band .wrap{display:grid;gap:12px;position:relative;z-index:1}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--tap)}
.bar-row h1{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;display:flex;align-items:center;gap:10px;min-width:0}
.bar-row h1 .mark{width:33px;height:33px;border-radius:8px;background:var(--sadu-mark) center/27px 27px no-repeat,#efe5d1;box-shadow:0 0 0 2px #1c1613;flex:none;image-rendering:pixelated}
.bar-row h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:14px;border:1px solid #ffffff2e;background:#00000026;color:var(--hdr-ink);display:grid;place-items:center;padding:0;flex:none}
.icon-btn:hover{background:#ffffff26}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta-row .sub{font-size:13.5px;opacity:.85}
.prog{display:flex;align-items:center;gap:10px}
.prog .val{font-size:13.5px;font-weight:600;white-space:nowrap}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:6px;border-radius:1px;background:#00000040}
.pips i.done{background:var(--hdr-ink)}
.pips i.now{background:#e8bd55;box-shadow:0 0 0 2px #e8bd5559}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(32px + env(safe-area-inset-bottom,0px))}
main .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
main .wrap > *{min-width:0}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;min-height:var(--tap)}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{background:none;border:0;padding:0 12px;min-height:var(--tap);border-radius:12px;color:var(--link);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;margin-inline-end:-12px}
.link:hover:not(:disabled){background:var(--win-soft)}
.link:disabled{color:var(--muted);opacity:.55}
.note{font-size:14px;color:var(--muted);background:var(--sunk);border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:10px 12px}

/* standings */
.standings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start;box-shadow:var(--shadow)}

/* ---- Saved-data validation: anything read from storage is checked and rebuilt from known-good values.
   Bad entries are dropped; if the game can't be rebuilt, the raw text is kept under "<key>-corrupt" and a fresh game starts. */
const ID_RE=/^[a-z0-9]{1,16}$/;
const cleanName = n => String(n ?? '').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,18);
const intIn = (v,min,max) => { const n=Number(v); return Number.isInteger(n)&&n>=min&&n<=max ? n : null; };
function readStore(key, clean){
  let raw=null; try{ raw=localStorage.getItem(key); }catch(e){ return null; }
  if(raw===null) return null;
  let v=null; try{ v=clean(JSON.parse(raw)); }catch(e){ v=null; }
  if(!v){ try{ localStorage.setItem(key+'-corrupt', raw); }catch(e){} }
  return v;
}
function cleanHand(v){
  if(!v||typeof v!=='object'||!Array.isArray(v.players)||!Array.isArray(v.history)) return null;
  const players=v.players.filter(p=>p&&typeof p==='object'&&ID_RE.test(p.id)).map(p=>({id:p.id,name:cleanName(p.name)||'?'}));
  if(players.length<3||players.length>5||new Set(players.map(p=>p.id)).size!==players.length) return null;
  const ids=new Set(players.map(p=>p.id)), ok=id=>typeof id==='string'&&ids.has(id), history=[];
  for(const r of v.history.slice(0,500)){
    if(!r||typeof r!=='object'||!ID_RE.test(r.id)||typeof r.type!=='string'||!Object.hasOwn(T,r.type)||!ok(r.winner)) continue;
    const entries={};
    for(const pl of players){ if(pl.id===r.winner) continue;
      const e=(r.entries&&typeof r.entries==='object'&&Object.hasOwn(r.entries,pl.id))?r.entries[pl.id]:null;
      const st=(e&&['none','down','foul'].includes(e.s))?e.s:'none';
      entries[pl.id] = st==='down' ? {s:'down',c:intIn(e.c,0,999)??0} : {s:st}; }
    history.push({id:r.id,type:r.type,winner:r.winner,entries,eid:(ok(r.eid)&&r.eid!==r.winner)?r.eid:null});
  }
  return {sample:v.sample===true, rounds:9, players, history};
}
function load(){ return readStore(KEY, cleanHand); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function pointsFor(round, pid){
  const t = T[round.type];
  if(pid===round.winner) return t.win;
  const e = round.entries[pid] || {s:'none'};
  const extra = (round.eid===pid && t.eid) ? t.eid : 0;   // من الإيد: discarded the winning card
  if(e.s==='foul') return t.foul + extra;
  if(e.s==='down') return (Number(e.c)||0) * t.mult + extra;
  return t.none + extra;
}

  S.history.forEach(r=>S.players.forEach(p=>tot[p.id]+=pointsFor(r,p.id)));
  return tot;
}

// Prediction chips: H = Normal Hand, J = Joker, JJ = Double Joker, JJJ = Double Joker Colored, Z = Zat.
// One chip = one round. The full sentence is kept as the accessible label / tooltip.
const CHIP = ['H','J','JJ','JJJ'];
const chip = (i, cls='') => `<span class="tk t${i} ${cls}">${CHIP[i]}</span>`;
function chipRow(idx, cls=''){
  const sorted=[...idx].sort((a,b)=>b-a), runs=[];
  sorted.forEach(i=>{ const r=runs[runs.length-1]; if(r&&r.i===i) r.n++; else runs.push({i,n:1}); });
  return `<span class="crow ${cls}">`+runs.map(r=> r.n>3 ? chip(r.i)+`<span class="times">× ${r.n}</span>` : chip(r.i).repeat(r.n)).join('')+`</span>`;
}
const pred = (text, body) => `<span class="pred" role="img" aria-label="${esc(text.replace(/<[^>]+>/g,''))}" title="${esc(text.replace(/<[^>]+>/g,''))}">${body}</span>`;

function needs(pid,tot){
  const others = S.players.filter(p=>p.id!==pid);
  const best = Math.min(...others.map(o=>tot[o.id]));
  const gap = tot[pid]-best;                          // >0: behind the best other player
  if(S.history.length===0) return pred(L('anyHand'), `<span class="crow">${chip(0)}</span>`);
  if(gap<0) return `<span class="ahead">${L('aheadBy',{n:`<b class="num">${-gap}</b>`})}</span>`;
  const left = S.rounds - S.history.length;           // rounds still to play, including this one
  const HANDS = TYPES.filter(t=>t.id!=='tkh');        // suggestions never rely on a Takhleesa
  const swing = t => t.none - t.win;                  // gap closed when this player finishes with t and the leader is not down
  // Every mix of hands that fits in the rounds left (counts per hand type, order doesn't matter).
  let fastest=null, easiest=null, tie1=null; const valid=[];
  const better = (a,b,keys) => { for(const k of keys){ if(a[k]!==b[k]) return a[k]<b[k]; } return false; };
  const walk = (start, k, sum, idx) => {
    if(k>0){
      const o = {idx:[...idx], k, top:idx[idx.length-1], weight:idx.reduce((a,b)=>a+b,0)};
      if(sum > gap){
        valid.push(o);
        return;                                       // adding more hands only makes this mix longer
      }
      if(k===1 && sum===gap && (!tie1 || o.top<tie1.top)) tie1=o;
    }
    if(k===left) return;
    for(let i=start;i<HANDS.length;i++){ idx.push(i); walk(i, k+1, sum+swing(HANDS[i]), idx); idx.pop(); }
  };
  walk(0,0,0,[]);
  valid.forEach(o=>{ if(!fastest || better(o,fastest,['k','top','weight'])) fastest=o; });
  // Second option only when it is realistic: smaller hands and at most one extra round.
  if(fastest) valid.forEach(o=>{ if(o.k<=fastest.k+1 && (!easiest || better(o,easiest,['top','k','weight']))) easiest=o; });
  const label = o => {
    const cnt={}; o.idx.forEach(i=>cnt[i]=(cnt[i]||0)+1);
    return Object.entries(cnt).sort((a,b)=>b[0]-a[0]).map(([i,c])=>(c>1?c+' × ':'')+tn(HANDS[i])).join(' + ');
  };
  const tieChip = tie1 ? `<span class="tie">${chip(tie1.top,'dash')}<span class="times">${L('tieWord')}</span></span>` : '';
  if(!fastest){
    // Out of reach with normal hands: only a Zat (زات) can still win it.
    const text = (tie1?L('tiesLead',{t:tn(HANDS[tie1.top])})+'. ':'') + L('needsZat',{z:L('zat')});
    return pred(text, `<span class="crow"><span class="tk tz">Z</span>${tieChip}</span><span class="zat-why">${L('onlyZat')}</span>`);
  }
  const text = [fastest.k===1 ? L('needsOne',{t:label(fastest)}) + (tie1?' '+L('ties',{t:tn(HANDS[tie1.top])}):'')
                              : L('needsOver',{p:label(fastest), k:roundsWord(fastest.k)})];
  let body = chipRow(fastest.idx) ;
  if(tie1 && fastest.k===1) body = body.replace(/<\/span>$/, tieChip+'</span>');
  if(easiest && easiest!==fastest && easiest.top<fastest.top){
    text.push(L('orOver',{p:label(easiest), k:roundsWord(easiest.k)}));
    body += chipRow(easiest.idx,'alt');
  }
  return pred(text.join(' '), body);
}

function othersSummary(t){
  const others = S.players.filter(p=>p.id!==F.winner);
  const down = others.filter(p=>entry(p.id).s==='down').length, foul = others.filter(p=>entry(p.id).s==='foul').length;

  const eidTxt = (F.eid && F.eid!==F.winner && (!t || t.eid)) ? L('xEid',{n:esc(nameOf(F.eid))}) : '';
  if(!parts.length) return (t?L('allNotDownEach',{n:t.none}):L('allNotDown')) + (eidTxt?' · '+eidTxt:'');

  return parts.join(' · ');
}

document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  formErr = '';
  if(a==='home'){ VIEW='home'; showSettings=false; F.picking=null; render(); window.scrollTo(0,0); return; }
  if(a==='open'){ VIEW=v; showSettings=false; render(); window.scrollTo(0,0); return; }
  if(a[0]==='x'){ return trixAction(a, v, el, ev); }
  switch(a){
    case 'pick': F.picking = v; render(); document.querySelector('.ptype')?.focus(); return;
    case 'pickclose': F.picking=null; break;
    case 'type': F.type=v; F.winner=F.picking; delete F.entries[F.winner]; if(F.eid===F.winner) F.eid=null; F.picking=null; break;
    case 'drawer': F.drawer=!F.drawer; break;
    case 'settings': showSettings=true; F.picking=null; break;
    case 'setclose': showSettings=false; break;
    case 'theme': P.theme=v; savePrefs(); break;
    case 'lang': P.lang=v; savePrefs(); break;
    case 'undo': return VIEW==='trix' ? tDoUndo() : doUndo();
    case 'st': { const pid=el.closest('[data-pid]').dataset.pid; const e=entry(pid);
      if(v==='eid'){ F.eid = F.eid===pid ? null : pid; break; }
      e.s = e.s===v ? 'none' : v; render();
      if(e.s==='down'){ const i=document.getElementById('c-'+pid); i&&i.focus(); } return; }
    case 'save': return saveRound();
    case 'cancel': F=freshForm(); break;
    case 'edit': { if(ev.target.closest('button')) return; const r=S.history.find(x=>x.id===v); if(!r) return;
      F={type:T[r.type].id,winner:r.winner,picking:null,editing:r.id,eid:r.eid||null,drawer:!!r.eid||Object.values(r.entries).some(e=>e.s!=='none'),
         entries:Object.fromEntries(Object.entries(r.entries).map(([k,e])=>[k,{s:e.s,c:e.c??''}]))};
      render(); document.getElementById('entry')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return; }
    case 'del': confirmDel=v; break;
    case 'delno': confirmDel=null; break;
    case 'delyes': { const i=S.history.findIndex(r=>r.id===v)+1; snap('l_del',i); S.history=S.history.filter(r=>r.id!==v); toast(L('tDeleted',{i}),true);
      if(F.editing===v) F=freshForm(); confirmDel=null; save(); break; }
    case 'new': showSettings=false; setup={count:S.players.length,names:[...S.players.map(p=>p.name),'','','','',''].slice(0,5)};
      if(S.sample) setup.names=['','','','','']; break;
    case 'scount': setup.count=+v; break;
    case 'scancel': setup=null; break;
    case 'sstart': return startGame();
    default: return;
  }
  render();
});

function updatePreview(){

function saveRound(){
  if(!F.winner||!F.type){ formErr=L('errWho'); return render(); }
  for(const p of S.players){
    if(p.id===F.winner) continue;
    const e = entry(p.id);
    if(e.s==='down'){
      const n = Number(e.c);
      if(e.c==='' || !Number.isFinite(n) || n<0 || n>999 || !Number.isInteger(n)){
        formErr = L('errCards',{n:p.name}); F.drawer=true; render();
        const i=document.getElementById('c-'+p.id); if(i){i.classList.add('err');i.focus();} return;
      }
    }
  }
  const entries = {};
  S.players.forEach(p=>{ if(p.id!==F.winner){ const e=entry(p.id); entries[p.id]= e.s==='down'?{s:'down',c:Number(e.c)}:{s:e.s}; }});
  const round = {id:F.editing||uid(), type:F.type, winner:F.winner, entries, eid:(T[F.type].eid && F.eid && F.eid!==F.winner)?F.eid:null};
  const idx = F.editing ? S.history.findIndex(r=>r.id===F.editing)+1 : S.history.length+1;
  snap(F.editing?'l_edit':'l_save', idx);
  toast(L(F.editing?'tUpdated':'tSaved',{i:idx}), true);
  if(F.editing) S.history = S.history.map(r=>r.id===F.editing?round:r);
  else S.history.push(round);
  F = freshForm(); save(); render();
}

function startGame(){
  const names = setup.names.slice(0,setup.count).map((n,i)=>cleanName(n)||L('playerN',{n:i+1}));
  const lower = names.map(n=>n.toLowerCase());
  if(new Set(lower).size!==lower.length){ formErr=L('errNames'); return render(); }
  snap('l_new',0); toast(L('tNew'),true);
  S = {rounds:9, players:names.map(name=>({id:uid(),name})), history:[]};
  setup=null; F=freshForm(); save(); render();
}

const TKEY='hasba-trix-v1';
const TXC=[
  {id:'king',     en:'King of Hearts', ar:'شيخ الكبة', ab:'K♥', abAr:'شيخ'},
  {id:'queens',   en:'Queens',         ar:'البنات',    ab:'Q',  abAr:'بنات'},
  {id:'diamonds', en:'Diamonds',       ar:'الديناري',  ab:'♦',  abAr:'ديناري'},
  {id:'coll',     en:'Collections',    ar:'اللطوش',    ab:'L',  abAr:'لطوش'},
  {id:'trix',     en:'Trix',           ar:'تركس',      ab:'T',  abAr:'تركس'},
];
const TXI=Object.fromEntries(TXC.map(c=>[c.id,c]));
const SUITS=[{k:'S',g:'♠',r:0},{k:'H',g:'♥',r:1},{k:'D',g:'♦',r:1},{k:'C',g:'♣',r:0}];
const TRIXPTS=[-200,-150,-100,-50];
const cName = c => P.lang==='ar'?c.ar:c.en;
const cAb = c => P.lang==='ar'?c.abAr:c.ab;

function tSample(){
  const p=['Fahad','Bader','Saud','Nawaf'].map(name=>({id:uid(),name})); const [a,b,c,d]=p.map(x=>x.id);
  return {sample:true, mode:'solo', complex:false, players:p, deals:[
    {id:uid(),k:0,owner:c,cs:['king','diamonds'],d:{king:{t:b,dbl:a},diamonds:{[a]:4,[b]:2,[c]:5,[d]:2}}},
    {id:uid(),k:0,owner:c,cs:['trix'],d:{trix:[c,a,d,b]}},
  ]};
}
function cleanTrix(v){
  if(!v||typeof v!=='object'||!Array.isArray(v.players)||!Array.isArray(v.deals)) return null;
  const players=v.players.filter(p=>p&&typeof p==='object'&&ID_RE.test(p.id)).map(p=>({id:p.id,name:cleanName(p.name)||'?'}));
  if(players.length!==4||new Set(players.map(p=>p.id)).size!==4) return null;
  const ids=new Set(players.map(p=>p.id)), ok=id=>typeof id==='string'&&ids.has(id), C=new Set(TXC.map(c=>c.id));
  const counts=o=>{ const out={}; if(o&&typeof o==='object') for(const id of ids) if(Object.hasOwn(o,id)){ const n=intIn(o[id],0,13); if(n) out[id]=n; } return out; };
  const deals=[];
  for(const d of v.deals.slice(0,100)){
    if(!d||typeof d!=='object'||!ID_RE.test(d.id)||intIn(d.k,0,3)===null||!ok(d.owner)||!Array.isArray(d.cs)) continue;
    const cs=TXC.map(c=>c.id).filter(c=>d.cs.includes(c));
    if(!cs.length||(cs.includes('trix')&&cs.length>1)) continue;
    const D=(d.d&&typeof d.d==='object')?d.d:{}, nd={};
    if(cs.includes('king')){ if(!ok(D.king?.t)) continue; nd.king={t:D.king.t, dbl:ok(D.king.dbl)?D.king.dbl:null}; }
    if(cs.includes('queens')){ const t={},dbl={}; if(SUITS.some(x=>!ok(D.queens?.t?.[x.k]))) continue;
      SUITS.forEach(x=>{ t[x.k]=D.queens.t[x.k]; dbl[x.k]=ok(D.queens?.dbl?.[x.k])?D.queens.dbl[x.k]:null; }); nd.queens={t,dbl}; }
    if(cs.includes('diamonds')) nd.diamonds=counts(D.diamonds);
    if(cs.includes('coll')) nd.coll=counts(D.coll);
    if(cs.includes('trix')){ const o=Array.isArray(D.trix)?[...new Set(D.trix.filter(ok))]:[]; if(o.length!==4) continue; nd.trix=o; }
    deals.push({id:d.id,k:d.k,owner:d.owner,cs,d:nd});
  }
  return {sample:v.sample===true, mode:v.mode==='partners'?'partners':'solo', complex:v.complex===true, players, deals};
}
function tLoad(){ return readStore(TKEY, cleanTrix); }
function tSave(){ try{ localStorage.setItem(TKEY, JSON.stringify(TS)); }catch(e){} }
let TS = tLoad() || tSample();
let TF = tFresh(), TSET=null, tConfirm=null;
const tundo=[];
function tFresh(){ return {editing:null,k:null,owner:null,cs:[],d:{king:{t:null,dbl:null,on:false},queens:{t:{},dbl:{},on:{}},diamonds:{},coll:{},trix:[]}}; }
function tSnap(k,i){ tundo.push({S:JSON.stringify(TS),k,i}); if(tundo.length>40) tundo.shift(); }
function tDoUndo(){ const u=tundo.pop(); if(!u) return; TS=JSON.parse(u.S); TF=tFresh(); tConfirm=null; TSET=null; tSave(); render(); toast(L('undone',{l:L(u.k,{i:u.i})}),false); }
const tName = id => (TS.players.find(p=>p.id===id)||{}).name||'';

function tPoints(deal){
  const pts=Object.fromEntries(TS.players.map(p=>[p.id,0])), d=deal.d||{}, add=(id,n)=>{ if(id in pts) pts[id]+=n; };
  if(deal.cs.includes('coll'))     Object.entries(d.coll||{}).forEach(([id,n])=>add(id,15*n));
  if(deal.cs.includes('diamonds')) Object.entries(d.diamonds||{}).forEach(([id,n])=>add(id,10*n));
  if(deal.cs.includes('queens')) SUITS.forEach(s=>{ const t=d.queens?.t?.[s.k], db=d.queens?.dbl?.[s.k]; if(!t) return;
    if(db){ add(t,50); if(db!==t) add(db,-25); } else add(t,25); });
  if(deal.cs.includes('king') && d.king?.t){ const t=d.king.t, db=d.king.dbl; if(db){ add(t,150); if(db!==t) add(db,-75); } else add(t,75); }
  if(deal.cs.includes('trix')) (d.trix||[]).forEach((id,i)=>add(id,TRIXPTS[i]||0));
  return pts;
}
function tTotals(){ const t=Object.fromEntries(TS.players.map(p=>[p.id,0])); TS.deals.forEach(d=>{ const p=tPoints(d); for(const k in p) t[k]+=p[k]; }); return t; }
function tTeams(tot){ const P4=TS.players; return [[P4[0],P4[2]],[P4[1],P4[3]]].map((m,i)=>({id:'t'+i,n:i+1,members:m,name:m.map(x=>x.name).join(' & '),tot:m.reduce((s,x)=>s+tot[x.id],0)})); }
function tLeader(tot){ if(TS.mode==='partners'){ const t=tTeams(tot).sort((a,b)=>a.tot-b.tot); return {name:t[0].name}; } return [...TS.players].sort((a,b)=>tot[a.id]-tot[b.id])[0]; }
function tKingdoms(excl){ const ks=[]; TS.deals.forEach(d=>{ if(d.id===excl) return; ks[d.k] ||= {owner:d.owner,used:new Set()}; d.cs.forEach(c=>ks[d.k].used.add(c)); }); return ks; }
function tCurK(ks){ for(let i=0;i<4;i++){ if(!ks[i] || ks[i].used.size<5) return i; } return 4; }
function tOver(){ return tCurK(tKingdoms())>=4; }
function tUsedCount(ks){ return ks.reduce((s,k)=>s+(k?k.used.size:0),0); }

function renderTrix(){

      ${tStandingsHTML(tot, over)}

    if(over && !TF.editing){

        <div class="chips"><button class="btn primary press" data-a="xnew">${L('tNewGame')}</button></div></section>`;
    } else html+=tFormHTML(ks,cur);
    html+=tKingdomsHTML(ks,cur,over);

function tStandingsHTML(tot, over){
  const tagFor=(lead)=>lead?`<span class="tag">${ico('crown','sm')}${L(over?'winner':'leading')}</span>`:'';
  const gapLine=(val, best, second)=> val===best ? (second===undefined||second===best?'':`<span class="ahead">${L('aheadT',{n:`<b class="num">${second-best}</b>`})}</span>`) : `<span class="ahead">${L('behind',{n:`<b class="num">${val-best}</b>`})}</span>`;

    return `<div class="pl ${lead?'lead':''}"><div class="rk"><span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>${tagFor(lead)}</div>

/* deal form */
function tCheck(){
  const f=TF, need=[]; const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
  if(f.k===null || !f.owner) need.push('owner');
  if(!f.cs.length) need.push('cs');
  if(f.cs.includes('king') && (!f.d.king.t || (f.d.king.on && !f.d.king.dbl))) need.push('king');
  if(f.cs.includes('queens') && SUITS.some(s=>!f.d.queens.t[s.k] || (f.d.queens.on[s.k] && !f.d.queens.dbl[s.k]))) need.push('queens');
  if(f.cs.includes('diamonds') && sum(f.d.diamonds)!==13) need.push('diamonds');
  if(f.cs.includes('coll') && sum(f.d.coll)!==13) need.push('coll');
  if(f.cs.includes('trix') && f.d.trix.length!==4) need.push('trix');
  return need;
}
function tFormDeal(){
  const f=TF, d={};
  if(f.cs.includes('king')) d.king={t:f.d.king.t, dbl:f.d.king.on?f.d.king.dbl:null};
  if(f.cs.includes('queens')) d.queens={t:{...f.d.queens.t}, dbl:Object.fromEntries(SUITS.map(s=>[s.k, f.d.queens.on[s.k]?f.d.queens.dbl[s.k]:null]))};
  if(f.cs.includes('diamonds')) d.diamonds={...f.d.diamonds};
  if(f.cs.includes('coll')) d.coll={...f.d.coll};
  if(f.cs.includes('trix')) d.trix=[...f.d.trix];
  return {id:f.editing||uid(), k:f.k, owner:f.owner, cs:TXC.map(c=>c.id).filter(c=>f.cs.includes(c)), d};
}

    <div class="hint">${L('trixAlone')}</div></div>`;
  const P4=TS.players, sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
  // king
  if(f.cs.includes('king')){ const K=f.d.king;
    h+=`<div class="tsec"><h4>${cName(TXI.king)} <span>${L('kingSub')}</span></h4>${pick('xkt',K.t)}
      <button class="dtog press" data-a="xkd" aria-pressed="${K.on}">×2 ${L('doubled')}</button>
      ${K.on?`<span class="dlab">${L('doubledBy')}</span>${pick('xkdb',K.dbl,'dbl')}`:''}</div>`; }
  // queens
  if(f.cs.includes('queens')){ const Q=f.d.queens;

        <button class="dtog press" data-a="xqd" data-s="${s.k}" aria-pressed="${!!Q.on[s.k]}">×2 ${L('doubled')}</button>
        ${Q.on[s.k]?`<span class="dlab">${L('doubledBy')}</span>${pick('xqdb',Q.dbl[s.k],'dbl').replace(/data-a="xqdb"/g,`data-a="xqdb" data-s="${s.k}"`)}`:''}
      </div></div>`).join('')}</div>`; }
  // counters
  const counter=(cid,title,sub)=>{ const o=f.d[cid], n=sum(o);
    return `<div class="tsec"><h4>${title} <span>${sub}</span></h4><div class="stp">${P4.map(p=>`<div><span>${esc(p.name)}</span><span class="ctl">
      <button class="press" data-a="xstep" data-c="${cid}" data-p="${p.id}" data-v="-1" aria-label="−">−</button><b>${o[p.id]||0}</b>
      <button class="press" data-a="xstep" data-c="${cid}" data-p="${p.id}" data-v="1" aria-label="+" ${n>=13?'disabled':''}>+</button></span></div>`).join('')}</div>
      <span class="chk ${n===13?'ok':''}">${n===13?'✓ ':''}${L('ofN',{a:n,b:13})}</span></div>`; };
  if(f.cs.includes('diamonds')) h+=counter('diamonds',cName(TXI.diamonds),L('diamondsEach'));
  if(f.cs.includes('coll')) h+=counter('coll',cName(TXI.coll),L('tricksEach'));
  // trix order
  if(f.cs.includes('trix')){ const o=f.d.trix;
    h+=`<div class="tsec"><h4>${cName(TXI.trix)} <span>${L('finishOrder')}</span></h4><div class="ord">${P4.map(p=>{ const i=o.indexOf(p.id);

  if(tErr) h+=`<div class="err-msg">${esc(tErr)}</div>`;
  const prev = f.cs.length ? tPoints(tFormDeal()) : null; const total = prev?Object.values(prev).reduce((a,b)=>a+b,0):0;
  h+=`<div class="actions"><span class="tot"><span class="hint">${L('dealTotal')}</span><b class="num">${fmt(total)}</b></span>
    <span class="btns">${f.editing?`<button class="btn press" data-a="xcancel">${L('cancel')}</button>`:''}
    <button class="btn primary press" data-a="xsave" ${ok?'':'disabled'}>${ico('check')}${L(f.editing?'saveChanges':'saveDeal')}</button></span></div>
    ${ok?'':`<div class="hint" style="text-align:end">${L(need.includes('owner')?'pickOwner':'fillAll')}</div>`}</section>`;
  return h;
}
let tErr='';

function tHistoryHTML(tot){
  const H=TS.deals, P4=TS.players;
  const head=`<tr><th>#</th><th>${L('contracts').split(' ')[0]}</th>${P4.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th></th></tr>`;
  const body = H.length ? H.map((d,i)=>{ const pts=tPoints(d);
    const dbl = (d.d.king&&d.d.king.dbl) || (d.d.queens&&Object.values(d.d.queens.dbl||{}).some(Boolean));
    const del = tConfirm===d.id
      ? `<span class="confirm">${L('delQ')} <button class="rowbtn press" style="color:var(--red)" data-a="xdelyes" data-v="${d.id}">${L('yes')}</button><button class="rowbtn press" data-a="xdelno">${L('no')}</button></span>`
      : `<button class="rowbtn press" data-a="xdel" data-v="${d.id}" aria-label="${L('deleteDeal',{i:i+1})}">${ico('trash','sm')}</button>`;
    return `<tr class="row-click ${TF.editing===d.id?'editing':''}" data-a="xedit" data-v="${d.id}"><td class="num">${i+1}</td>
      <td><span class="cs">${d.cs.map(c=>TXI[c].ab).join(' ')}</span>${dbl?`<sup class="eidm">×2</sup>`:''}<span class="ow">${esc(tName(d.owner))}</span></td>
      ${P4.map(p=>`<td class="c">${fmt(pts[p.id])}</td>`).join('')}<td>${del}</td></tr>`; }).join('')
    : `<tr><td colspan="${P4.length+3}" class="empty">${L('noDeals')}</td></tr>`;
  const foot=`<tr><td></td><td>${L('total')}</td>${P4.map(p=>`<td class="c">${fmtT(tot[p.id])}</td>`).join('')}<td></td></tr>`;
  return `<section><div class="sec-h"><h2>${L('deals')}</h2><span class="hint">${L('tapEditDeal')}</span></div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div></section>`;
}

function tSetupHTML(){
  const s=TSET;
  return `<section class="card"><h3>${L('tNewGame')}</h3>
    <div class="field"><span class="lab">${L('mode')}</span><div class="pgrid" style="grid-template-columns:repeat(2,1fr)">
      ${['solo','partners'].map(m=>`<button class="chip press" data-a="xmode" data-v="${m}" aria-pressed="${s.mode===m}">${L(m)}</button>`).join('')}</div>
      ${s.mode==='partners'?`<div class="hint">${L('partnersHint')}</div>`:''}</div>
    <div class="field"><span class="lab">${L('names')}</span><div class="names">
      ${s.names.map((nm,i)=>`<input id="tname-${i}" data-tname="${i}" value="${esc(nm)}" placeholder="${L('seat',{n:i+1})}${s.mode==='partners'?` · ${L('teamN',{n:i%2+1})}`:''}" maxlength="18" autocomplete="off">`).join('')}</div></div>
    <div class="tgl"><span><b>${L('complex')}</b><small>${L('complexHint')}</small></span><button class="sw press" data-a="xcomplex" aria-pressed="${s.complex}" aria-label="${L('complex')}"><i></i></button></div>
    <div class="hint">${L('tGameInfo')}</div>
    ${tErr?`<div class="err-msg">${esc(tErr)}</div>`:''}
    <div class="setup-actions"><span class="hint">${L('replaces')}</span>
      <span class="chips"><button class="btn press" data-a="xscancel">${L('cancel')}</button><button class="btn primary press" data-a="xstart">${L('startGame')}</button></span></div></section>`;
}
function trixSettingsHTML(){
  return `<div class="set-sec"><h4>${L('game')}</h4>
      <div class="hint">${L(TS.mode)} · ${L('tGameInfo')}</div>
      <div class="tgl"><span><b>${L('complex')}</b><small>${L('complexHint')}</small></span><button class="sw press" data-a="xcomplexg" aria-pressed="${!!TS.complex}" aria-label="${L('complex')}"><i></i></button></div>
      <button class="btn primary press" data-a="xnew" style="justify-self:start">${L('tNewGame')}</button></div>
    <div class="set-sec"><h4>${L('trixRef')}</h4>
      <div class="ref-wrap"><table style="min-width:0"><tbody>${TXC.map(c=>`<tr><td style="text-align:start;white-space:normal"><b>${cName(c)}</b></td><td style="text-align:start;white-space:normal">${L('r_'+c.id)}</td></tr>`).join('')}</tbody></table></div>
      <div class="hint">${L('selfDbl')}</div></div>`;
}

function trixAction(a, v, el, ev){
  tErr='';
  const f=TF, P4=TS.players;
  switch(a){
    case 'xowner': f.owner=v; break;
    case 'xc': {
      if(v==='trix'){ f.cs = f.cs.includes('trix') ? [] : ['trix']; break; }
      f.cs=f.cs.filter(c=>c!=='trix');
      if(f.cs.includes(v)){ f.cs=f.cs.filter(c=>c!==v); break; }
      if(!TS.complex && f.cs.length>=3){ tErr=L('complexOff'); break; }
      f.cs.push(v); break; }
    case 'xkt': f.d.king.t=v; break;
    case 'xkd': f.d.king.on=!f.d.king.on; if(!f.d.king.on) f.d.king.dbl=null; break;
    case 'xkdb': f.d.king.dbl = f.d.king.dbl===v?null:v; break;
    case 'xqt': f.d.queens.t[el.dataset.s]=v; break;
    case 'xqd': { const k=el.dataset.s; f.d.queens.on[k]=!f.d.queens.on[k]; if(!f.d.queens.on[k]) f.d.queens.dbl[k]=null; break; }
    case 'xqdb': { const k=el.dataset.s; f.d.queens.dbl[k] = f.d.queens.dbl[k]===v?null:v; break; }
    case 'xstep': { const o=f.d[el.dataset.c], pid=el.dataset.p, n=Object.values(o).reduce((x,y)=>x+y,0), dv=+v;
      const cur=o[pid]||0; if(dv>0 && n>=13) break; o[pid]=Math.max(0,cur+dv); break; }
    case 'xord': { const o=f.d.trix, i=o.indexOf(v);
      if(i>=0) o.splice(i,1); else if(o.length<4){ o.push(v); if(o.length===3){ const last=P4.find(p=>!o.includes(p.id)); o.push(last.id); } }
      break; }
    case 'xsave': return tSaveDeal();
    case 'xcancel': TF=tFresh(); break;
    case 'xedit': { if(ev.target.closest('button')) return; const d=TS.deals.find(x=>x.id===v); if(!d) return;
      const D=d.d; TF={editing:d.id,k:d.k,owner:d.owner,cs:[...d.cs],d:{
        king:{t:D.king?.t||null,dbl:D.king?.dbl||null,on:!!D.king?.dbl},
        queens:{t:{...(D.queens?.t||{})},dbl:{...(D.queens?.dbl||{})},on:Object.fromEntries(SUITS.map(s=>[s.k,!!D.queens?.dbl?.[s.k]]))},
        diamonds:{...(D.diamonds||{})}, coll:{...(D.coll||{})}, trix:[...(D.trix||[])]}};
      render(); document.getElementById('entry')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return; }
    case 'xdel': tConfirm=v; break;
    case 'xdelno': tConfirm=null; break;
    case 'xdelyes': { const i=TS.deals.findIndex(x=>x.id===v)+1; tSnap('l_tdel',i); TS.deals=TS.deals.filter(x=>x.id!==v); toast(L('tDealDeleted',{i}),true);
      if(TF.editing===v) TF=tFresh(); tConfirm=null; tSave(); break; }
    case 'xnew': showSettings=false; TSET={mode:TS.mode||'solo', complex:!!TS.complex, names:TS.sample?['','','','']:P4.map(p=>p.name)}; break;
    case 'xmode': TSET.mode=v; break;
    case 'xcomplex': TSET.complex=!TSET.complex; break;
    case 'xcomplexg': TS.complex=!TS.complex; tSave(); break;
    case 'xscancel': TSET=null; break;
    case 'xstart': {
      const names=TSET.names.map((n,i)=>cleanName(n)||L('seat',{n:i+1})); const low=names.map(n=>n.toLowerCase());
      if(new Set(low).size!==4){ tErr=L('errNames'); break; }
      tSnap('l_tnew',0); toast(L('tNew'),true);
      TS={mode:TSET.mode, complex:TSET.complex, players:names.map(name=>({id:uid(),name})), deals:[]};
      TSET=null; TF=tFresh(); tSave(); break; }
    default: return;
  }
  render();
}
function tSaveDeal(){
  if(tCheck().length) return render();
  const deal=tFormDeal(); const idx = TF.editing ? TS.deals.findIndex(x=>x.id===TF.editing)+1 : TS.deals.length+1;
  tSnap(TF.editing?'l_tedit':'l_tsave', idx); toast(L(TF.editing?'tDealUpdated':'tDealSaved',{i:idx}), true);
  if(TF.editing) TS.deals=TS.deals.map(x=>x.id===TF.editing?deal:x); else TS.deals.push(deal);
  delete TS.sample; TF=tFresh(); tSave(); render();
}

// Android back button: close the topmost sheet or form; return true if something closed.
window.__back = () => {
  if(showSettings){ showSettings=false; render(); return true; }
  if(VIEW==='trix'){
    if(TSET){ TSET=null; render(); return true; }
    if(TF.editing){ TF=tFresh(); render(); return true; }
    VIEW='home'; render(); return true;
  }
  if(VIEW==='hand' && !F.picking && !setup && !F.editing){ VIEW='home'; render(); return true; }
  if(F.picking){ F.picking=null; render(); return true; }
  if(setup){ setup=null; render(); return true; }
  if(F.editing){ F=freshForm(); render(); return true; }
  return false;
};
render();
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
