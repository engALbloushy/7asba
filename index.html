:root[lang="ar"]{ --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1310; --surface:#131d19; --sunk:#0f1814; --ink:#e6eee9; --muted:#9aaba2; --line:#24322b; --line-strong:#33453c;
  --felt:#164a37; --felt-hi:#1d5e46; --on-felt:#eef8f3; --red:#f07780; --red-soft:#3a1c20;
  --gold:#e8bd55; --gold-hi:#e8bd55; --gold-soft:#2c2412; --win:#62cfa1; --win-soft:#17302a; --link:#62cfa1;
  --shadow:0 1px 2px #0006; --hdr:#6c151b; --jj-bg:#1f5440; --jj-ink:#a6ecc9; --jj-line:#2f6b53; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1310; --surface:#131d19; --sunk:#0f1814; --ink:#e6eee9; --muted:#9aaba2; --line:#24322b; --line-strong:#33453c;
  --felt:#164a37; --felt-hi:#1d5e46; --on-felt:#eef8f3; --red:#f07780; --red-soft:#3a1c20;

*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.alt{color:var(--muted);font-size:.9em}
.hint{font-size:13.5px;color:var(--muted)}
.lab{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* press feedback */
.press{transition:transform .12s var(--ease),background-color .15s,border-color .15s,color .15s}
.press:active:not(:disabled){transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.press{transition:none}.press:active:not(:disabled){transform:none;opacity:.8}}

/* app bar */
header.band{background:var(--hdr);color:var(--hdr-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;position:relative;overflow:hidden}
header.band::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 140% at 100% 0%,#ffffff12 0,transparent 55%),repeating-linear-gradient(0deg,#00000014 0 1px,transparent 1px 3px)}
.sadu-band{height:var(--sadu-band-h);background:var(--sadu-band) repeat-x;background-position:center top}
.wrap{max-width:720px;margin:0 auto}
.band .wrap{display:grid;gap:12px;position:relative;z-index:1}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--tap)}
.bar-row h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;display:flex;align-items:center;gap:10px;min-width:0}
.bar-row h1 .mark{width:33px;height:33px;border-radius:8px;background:var(--sadu-mark) center/27px 27px no-repeat,#efe5d1;box-shadow:0 0 0 2px #1c1613;flex:none;image-rendering:pixelated}
.bar-row h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:14px;border:1px solid #ffffff2e;background:#00000026;color:var(--hdr-ink);display:grid;place-items:center;padding:0;flex:none}
.icon-btn:hover{background:#ffffff26}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta-row .sub{font-size:13.5px;opacity:.85}
.prog{display:flex;align-items:center;gap:10px}
.prog .val{font-size:13.5px;font-weight:600;white-space:nowrap}
.pips{display:flex;gap:4px}

function pointsFor(round, pid){
  const t = T[round.type];
  if(pid===round.winner) return t.win;
  const e = round.entries[pid] || {s:'none'};
  const extra = (round.eid===pid && t.eid) ? t.eid : 0;   // من الإيد: discarded the winning card
  if(e.s==='foul') return t.foul + extra;
  if(e.s==='down') return (Number(e.c)||0) * t.mult + extra;
  return t.none + extra;
}
function totals(){
  const tot = Object.fromEntries(S.players.map(p=>[p.id,0]));
  S.history.forEach(r=>S.players.forEach(p=>tot[p.id]+=pointsFor(r,p.id)));
  return tot;
}

// Prediction chips: H = Normal Hand, J = Joker, JJ = Double Joker, JJJ = Double Joker Colored, Z = Zat.
// One chip = one round. The full sentence is kept as the accessible label / tooltip.
const CHIP = ['H','J','JJ','JJJ'];
const chip = (i, cls='') => `<span class="tk t${i} ${cls}">${CHIP[i]}</span>`;
function chipRow(idx, cls=''){
  const sorted=[...idx].sort((a,b)=>b-a), runs=[];
  sorted.forEach(i=>{ const r=runs[runs.length-1]; if(r&&r.i===i) r.n++; else runs.push({i,n:1}); });
  return `<span class="crow ${cls}">`+runs.map(r=> r.n>3 ? chip(r.i)+`<span class="times">× ${r.n}</span>` : chip(r.i).repeat(r.n)).join('')+`</span>`;
}
const pred = (text, body) => `<span class="pred" role="img" aria-label="${esc(text.replace(/<[^>]+>/g,''))}" title="${esc(text.replace(/<[^>]+>/g,''))}">${body}</span>`;

function needs(pid,tot){
  const others = S.players.filter(p=>p.id!==pid);
  const best = Math.min(...others.map(o=>tot[o.id]));
  const gap = tot[pid]-best;                          // >0: behind the best other player
  if(S.history.length===0) return pred(L('anyHand'), `<span class="crow">${chip(0)}</span>`);
  if(gap<0) return `<span class="ahead">${L('aheadBy',{n:`<b class="num">${-gap}</b>`})}</span>`;
  const left = S.rounds - S.history.length;           // rounds still to play, including this one
  const HANDS = TYPES.filter(t=>t.id!=='tkh');        // suggestions never rely on a Takhleesa
  const swing = t => t.none - t.win;                  // gap closed when this player finishes with t and the leader is not down
  // Every mix of hands that fits in the rounds left (counts per hand type, order doesn't matter).
  let fastest=null, easiest=null, tie1=null; const valid=[];
  const better = (a,b,keys) => { for(const k of keys){ if(a[k]!==b[k]) return a[k]<b[k]; } return false; };
  const walk = (start, k, sum, idx) => {
    if(k>0){
      const o = {idx:[...idx], k, top:idx[idx.length-1], weight:idx.reduce((a,b)=>a+b,0)};
      if(sum > gap){
        valid.push(o);
        return;                                       // adding more hands only makes this mix longer
      }
      if(k===1 && sum===gap && (!tie1 || o.top<tie1.top)) tie1=o;
    }
    if(k===left) return;
    for(let i=start;i<HANDS.length;i++){ idx.push(i); walk(i, k+1, sum+swing(HANDS[i]), idx); idx.pop(); }
  };
  walk(0,0,0,[]);
  valid.forEach(o=>{ if(!fastest || better(o,fastest,['k','top','weight'])) fastest=o; });
  // Second option only when it is realistic: smaller hands and at most one extra round.
  if(fastest) valid.forEach(o=>{ if(o.k<=fastest.k+1 && (!easiest || better(o,easiest,['top','k','weight']))) easiest=o; });
  const label = o => {
    const cnt={}; o.idx.forEach(i=>cnt[i]=(cnt[i]||0)+1);
    return Object.entries(cnt).sort((a,b)=>b[0]-a[0]).map(([i,c])=>(c>1?c+' × ':'')+tn(HANDS[i])).join(' + ');
  };
  const tieChip = tie1 ? `<span class="tie">${chip(tie1.top,'dash')}<span class="times">${L('tieWord')}</span></span>` : '';
  if(!fastest){
    // Out of reach with normal hands: only a Zat (زات) can still win it.
    const text = (tie1?L('tiesLead',{t:tn(HANDS[tie1.top])})+'. ':'') + L('needsZat',{z:L('zat')});
    return pred(text, `<span class="crow"><span class="tk tz">Z</span>${tieChip}</span><span class="zat-why">${L('onlyZat')}</span>`);
  }
  const text = [fastest.k===1 ? L('needsOne',{t:label(fastest)}) + (tie1?' '+L('ties',{t:tn(HANDS[tie1.top])}):'')
                              : L('needsOver',{p:label(fastest), k:roundsWord(fastest.k)})];
  let body = chipRow(fastest.idx) ;
  if(tie1 && fastest.k===1) body = body.replace(/<\/span>$/, tieChip+'</span>');
  if(easiest && easiest!==fastest && easiest.top<fastest.top){
    text.push(L('orOver',{p:label(easiest), k:roundsWord(easiest.k)}));
    body += chipRow(easiest.idx,'alt');
  }
  return pred(text.join(' '), body);
}

function othersSummary(t){
  const others = S.players.filter(p=>p.id!==F.winner);
  const down = others.filter(p=>entry(p.id).s==='down').length, foul = others.filter(p=>entry(p.id).s==='foul').length;
  const parts=[]; if(down) parts.push(L('xDown',{n:down})); if(foul) parts.push(L('xFoul',{n:foul}));
  const rest = others.length-down-foul;
  const eidTxt = (F.eid && F.eid!==F.winner && (!t || t.eid)) ? L('xEid',{n:esc(nameOf(F.eid))}) : '';
  if(!parts.length) return (t?L('allNotDownEach',{n:t.none}):L('allNotDown')) + (eidTxt?' · '+eidTxt:'');
  if(rest) parts.push(L('xNotDown',{n:rest}));
  if(eidTxt) parts.push(eidTxt);
  return parts.join(' · ');
}

      <button class="btn primary press" data-a="new" style="justify-self:start">${L('newGame')}</button></div>
    <div class="set-sec"><h4>${L('scoringRef')}</h4>
      <div class="ref-wrap"><table><thead><tr><th>${L('finish')}</th><th>${L('finisher')}</th><th>${L('notDown')}</th><th>${L('wentDown')}</th><th>${L('foul')}</th><th>${L('eid')}</th></tr></thead><tbody>
      ${TYPES.map(t=>`<tr><td style="text-align:start">${tn(t)} ${tnAlt(t)}</td><td class="c">${fmtT(t.win)}</td><td class="c">${t.none}</td><td class="c">× ${t.mult}</td><td class="c">${t.foul}</td><td class="c">${t.eid?'+'+t.eid:'—'}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="hint">${L('tkNote')}</div></div>
    <button class="btn press" data-a="setclose">${L('close')}</button>
  </div>`;
}

function historyHTML(tot){
  const H = S.history;
  const head = `<tr><th>#</th><th>${L('finish')}</th>${S.players.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th></th></tr>`;
  const body = H.length ? H.map((r,i)=>{
    const t = T[r.type];
    const del = confirmDel===r.id
      ? `<span class="confirm">${L('delQ')} <button class="rowbtn press" style="color:var(--red)" data-a="delyes" data-v="${r.id}">${L('yes')}</button><button class="rowbtn press" data-a="delno">${L('no')}</button></span>`
      : `<button class="rowbtn press" data-a="del" data-v="${r.id}" aria-label="${L('deleteRound',{i:i+1})}">${ico('trash','sm')}</button>`;
    return `<tr class="row-click ${F.editing===r.id?'editing':''}" data-a="edit" data-v="${r.id}"><td class="num">${i+1}</td>
      <td class="type-tag">${tn(t)}</td>
      ${S.players.map(p=>{const v=pointsFor(r,p.id);const e=r.entries[p.id];
        return `<td class="c ${p.id===r.winner?'w':''} ${e&&e.s==='foul'?'f':''}">${fmt(v)}${e&&e.s==='down'?`<sup class="downm">${L('downShort')}</sup>`:''}${r.eid===p.id&&t.eid?`<sup class="eidm">${L('eidShort')}</sup>`:''}</td>`}).join('')}
      <td>${del}</td></tr>`;}).join('')
    : `<tr><td colspan="${S.players.length+3}" class="empty">${L('noRounds')}</td></tr>`;
  const foot = `<tr><td></td><td>${L('total')}</td>${S.players.map(p=>`<td class="c">${fmtT(tot[p.id])}</td>`).join('')}<td></td></tr>`;
  return `<section><div class="sec-h"><h2>${L('rounds')}</h2><span class="hint">${L('tapEdit')}</span></div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div></section>`;
}

function setupHTML(){
  const s = setup;
  return `<section class="card">
    <h3>${L('newGame')}</h3>
    <div class="field"><span class="lab">${L('players')}</span><div class="pgrid" style="grid-template-columns:repeat(3,1fr)">
      ${[3,4,5].map(k=>`<button class="chip press" data-a="scount" data-v="${k}" aria-pressed="${s.count===k}">${L('nPlayers',{n:k})}</button>`).join('')}</div></div>
    <div class="field"><span class="lab">${L('names')}</span><div class="names">
      ${s.names.slice(0,s.count).map((nm,i)=>`<input id="name-${i}" data-name="${i}" value="${esc(nm)}" placeholder="${L('playerN',{n:i+1})}" maxlength="18" autocomplete="off">`).join('')}</div></div>
    <div class="hint">${L('nineRounds')}</div>
    ${formErr?`<div class="err-msg">${esc(formErr)}</div>`:''}
    <div class="setup-actions"><span class="hint">${L('replaces')}</span>
      <span class="chips"><button class="btn press" data-a="scancel">${L('cancel')}</button><button class="btn primary press" data-a="sstart">${L('startGame')}</button></span></div>
  </section>`;
}

/* events */
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  formErr = '';
  switch(a){
    case 'pick': F.picking = v; render(); document.querySelector('.ptype')?.focus(); return;
    case 'pickclose': F.picking=null; break;
    case 'type': F.type=v; F.winner=F.picking; delete F.entries[F.winner]; if(F.eid===F.winner) F.eid=null; F.picking=null; break;
    case 'drawer': F.drawer=!F.drawer; break;
    case 'settings': showSettings=true; F.picking=null; break;
    case 'setclose': showSettings=false; break;
    case 'theme': P.theme=v; savePrefs(); break;
    case 'lang': P.lang=v; savePrefs(); break;
    case 'undo': return doUndo();
    case 'st': { const pid=el.closest('[data-pid]').dataset.pid; const e=entry(pid);
      if(v==='eid'){ F.eid = F.eid===pid ? null : pid; break; }
      e.s = e.s===v ? 'none' : v; render();
      if(e.s==='down'){ const i=document.getElementById('c-'+pid); i&&i.focus(); } return; }
    case 'save': return saveRound();
    case 'cancel': F=freshForm(); break;
    case 'edit': { if(ev.target.closest('button')) return; const r=S.history.find(x=>x.id===v); if(!r) return;
      F={type:T[r.type].id,winner:r.winner,picking:null,editing:r.id,eid:r.eid||null,drawer:!!r.eid||Object.values(r.entries).some(e=>e.s!=='none'),
         entries:Object.fromEntries(Object.entries(r.entries).map(([k,e])=>[k,{s:e.s,c:e.c??''}]))};
      render(); document.getElementById('entry')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return; }
    case 'del': confirmDel=v; break;
    case 'delno': confirmDel=null; break;
    case 'delyes': { const i=S.history.findIndex(r=>r.id===v)+1; snap('l_del',i); S.history=S.history.filter(r=>r.id!==v); toast(L('tDeleted',{i}),true);
      if(F.editing===v) F=freshForm(); confirmDel=null; save(); break; }
    case 'new': showSettings=false; setup={count:S.players.length,names:[...S.players.map(p=>p.name),'','','','',''].slice(0,5)};
      if(S.sample) setup.names=['','','','','']; break;
    case 'scount': setup.count=+v; break;
    case 'scancel': setup=null; break;
    case 'sstart': return startGame();
    default: return;
  }
  render();
});
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.dataset.cards){ entry(t.dataset.cards).c = t.value; t.classList.remove('err'); updatePreview(); }
  if(t.dataset.name!==undefined && setup){ setup.names[+t.dataset.name] = t.value; }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && (showSettings||F.picking)){ showSettings=false; F.picking=null; render(); }});

function updatePreview(){
  S.players.forEach(p=>{ const el=document.getElementById('pts-'+p.id); if(el) el.textContent = F.winner?fmt(previewPts(p.id)):'—'; });
  const s=document.getElementById('sum'); if(s) s.textContent=fmt(roundSum());
}

function saveRound(){
  if(!F.winner||!F.type){ formErr=L('errWho'); return render(); }
  for(const p of S.players){
    if(p.id===F.winner) continue;
    const e = entry(p.id);
    if(e.s==='down'){
      const n = Number(e.c);
      if(e.c==='' || !Number.isFinite(n) || n<0 || !Number.isInteger(n)){
        formErr = L('errCards',{n:p.name}); F.drawer=true; render();
        const i=document.getElementById('c-'+p.id); if(i){i.classList.add('err');i.focus();} return;
      }
    }
  }
  const entries = {};
  S.players.forEach(p=>{ if(p.id!==F.winner){ const e=entry(p.id); entries[p.id]= e.s==='down'?{s:'down',c:Number(e.c)}:{s:e.s}; }});
  const round = {id:F.editing||uid(), type:F.type, winner:F.winner, entries, eid:(T[F.type].eid && F.eid && F.eid!==F.winner)?F.eid:null};
  const idx = F.editing ? S.history.findIndex(r=>r.id===F.editing)+1 : S.history.length+1;
  snap(F.editing?'l_edit':'l_save', idx);
  toast(L(F.editing?'tUpdated':'tSaved',{i:idx}), true);
  if(F.editing) S.history = S.history.map(r=>r.id===F.editing?round:r);
  else S.history.push(round);
  F = freshForm(); save(); render();
}

function startGame(){
  const names = setup.names.slice(0,setup.count).map((n,i)=>n.trim()||L('playerN',{n:i+1}));
  const lower = names.map(n=>n.toLowerCase());
  if(new Set(lower).size!==lower.length){ formErr=L('errNames'); return render(); }
  snap('l_new',0); toast(L('tNew'),true);
  S = {rounds:9, players:names.map(name=>({id:uid(),name})), history:[]};
  setup=null; F=freshForm(); save(); render();
}

// Android back button: close the topmost sheet or form; return true if something closed.
window.__back = () => {
  if(showSettings){ showSettings=false; render(); return true; }
  if(F.picking){ F.picking=null; render(); return true; }
  if(setup){ setup=null; render(); return true; }
  if(F.editing){ F=freshForm(); render(); return true; }
  return false;
};
render();
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
